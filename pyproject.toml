[project]
name = "mcp-runtime-sentinel"
version = "0.2.0"
description = "Self-hosted MCP security gateway with pre-execution policy enforcement"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "jsonschema>=4.22,<5"]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "coverage>=7.6,<8",
    "pytest>=8,<10",
    "mutmut>=3.8,<4",
    "types-jsonschema>=4.22,<5",
]

[project.scripts]
mcp-sentinel = "sentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["sentinel/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = [
    "sentinel",
]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["sentinel.*"]
strict = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["sentinel"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
[tool.pytest.ini_options]
markers = ["stress: concurrency stress tests; run explicitly with pytest -m stress"]
testpaths = ["tests"]
[tool.mutmut]
source_paths = ["sentinel"]
only_mutate = [
    "sentinel/gateway.py",
    "sentinel/baseline.py",
    "sentinel/policy.py",
    "sentinel/http_limits.py",
    "sentinel/audit_log.py",
    "sentinel/provenance.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_audit_log.py",
    "tests/test_baseline_management.py",
    "tests/test_coverage_boost.py",
    "tests/test_gateway_integration.py",
    "tests/test_gateway_completion.py",
    "tests/test_gateway_errors.py",
    "tests/test_gateway_operator_http.py",
    "tests/test_gateway_security_config.py",
    "tests/test_gateway_state.py",
    "tests/test_gateway_streamable_http.py",
    "tests/test_gateway_sse_parser.py",
    "tests/test_enforcement_flows.py",
    "tests/test_http_hardening.py",
    "tests/test_http_limits.py",
    "tests/test_preexecution_policy.py",
    "tests/test_provenance.py",
    "tests/test_runtime_regressions.py",
]
